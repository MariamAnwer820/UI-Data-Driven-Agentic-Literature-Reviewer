
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Literature Reviewer</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --wine:#b01a4e;
  --wine2:#7d0f37;
  --deep:#1a0714;
  --ink:#12040d;
  --rose:#fde3ea;
  --bg:#fff8f7;
  --gold:#f2b872;
  --card:#fff;
  --tx:#1d1417;
  --mu:#7d6f73;
  --bd:#eadfe1;
  --fs:15px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

/* System Dark Mode */
@media(prefers-color-scheme:dark) {
  :root:not([data-theme=light]) {
    --bg:#161013;
    --card:#201619;
    --tx:#f3e9eb;
    --mu:#a8979b;
    --bd:#35262b;
    --rose:#3a1a24;
  }
}

/* Explicit Light Mode */
:root[data-theme=light] {
  color-scheme:light;
  --bg:#fff8f7;
  --card:#ffffff;
  --tx:#1d1417;
  --mu:#7d6f73;
  --bd:#eadfe1;
  --rose:#fde3ea;
}

/* Explicit Dark Mode */
:root[data-theme=dark] {
  color-scheme:dark;
  --bg:#161013;
  --card:#201619;
  --tx:#f3e9eb;
  --mu:#a8979b;
  --bd:#49343b;
  --rose:#3a1a24;
}

/* Global */
* {
  box-sizing:border-box;
  margin:0;
}

html,body,#root {
  height:100%;
}

body {
  background:var(--ink);
  color:var(--tx);
  font:var(--fs)/1.5 Inter,system-ui,sans-serif;
}

.serif {
  font-family:'Playfair Display',Georgia,serif;
}

button {
  font:inherit;
  cursor:pointer;
  border:0;
  background:none;
  color:inherit;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline:2px solid #d4506f;
  outline-offset:2px;
}

/* Splash */
.splash {
  height:100%;
  display:grid;
  place-items:center;
  text-align:center;
  color:#f6dfe3;
  background:radial-gradient(ellipse at 50% 120%,#5a0c22,transparent 60%),var(--ink);
  position:relative;
  overflow:hidden;
}

.splash svg.w {
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  opacity:.5;
}

.spin {
  width:22px;
  height:22px;
  border:2px solid #7a123055;
  border-top-color:#d4506f;
  border-radius:50%;
  margin:26px auto 10px;
  animation:sp 1s linear infinite;
}

@keyframes sp {
  to {transform:rotate(360deg)}
}

/* Login */
.login {
  height:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
}

.lbrand {
  background:linear-gradient(160deg,var(--wine2),#2a0711);
  color:#f6dfe3;
  padding:48px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:14px;
}

.lbrand li {
  list-style:none;
  display:flex;
  gap:10px;
  align-items:center;
  margin-top:12px;
  font-size:14px;
}

.lform {
  background:#fff;
  color:#1d1417;
  display:grid;
  place-items:center;
  padding:24px;
}

.lform>div {
  width:min(340px,100%);
}

/* Inputs */
.in {
  width:100%;
  padding:11px 12px;
  border:1px solid var(--bd);
  border-radius:8px;
  background:var(--card);
  color:var(--tx);
  font:inherit;
  margin-top:12px;
}

.in option {
  background:var(--card);
  color:var(--tx);
}

.in::placeholder {
  color:var(--mu);
  opacity:.8;
}

.ta {
  width:100%;
  min-height:110px;
  border:1px solid var(--bd);
  border-radius:12px;
  padding:14px;
  background:var(--card);
  color:var(--tx);
  font:inherit;
  resize:vertical;
}

/* Buttons */
.btn {
  background:linear-gradient(135deg,#c2185b,#7d0f37);
  color:#fff;
  border-radius:10px;
  padding:10px 16px;
  font-weight:500;
  display:inline-flex;
  align-items:center;
  gap:8px;
  justify-content:center;
  position:relative;
  overflow:hidden;
  transition:all .2s;
}

.btn:hover {
  filter:brightness(1.12);
  transform:translateY(-2px);
  box-shadow:0 10px 22px #b01a4e55;
}

.btn:active {
  transform:scale(.97);
}

.btn:not(.o):not(.g)::after {
  content:'';
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(110deg,transparent 35%,#ffffff40 50%,transparent 65%);
  background-size:250% 100%;
  animation:sh 3.5s linear infinite;
}

.btn.o {
  background:none;
  color:var(--wine);
  border:1px solid var(--wine);
}

.btn.o:hover {
  background:var(--rose);
}

.btn.g {
  background:#fff;
  color:#1d1417;
  border:1px solid #eadfe1;
}

/* Main Layout */
.shell {
  height:100%;
  display:grid;
  grid-template-columns:230px 1fr;
  background:
    radial-gradient(ellipse at 90% -10%,#fbcfdb99,transparent 50%),
    radial-gradient(ellipse at 0% 110%,#f2b87238,transparent 45%),
    var(--bg);
}

.side {
  background:linear-gradient(190deg,#2e0b1f,#12040d);
  color:#d9c8cc;
  padding:20px 12px;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.side .logo {
  padding:6px 8px 22px;
  text-align:center;
  color:#f6dfe3;
}

.nv {
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px 12px;
  border-radius:8px;
  font-size:14px;
  text-align:left;
  width:100%;
}

.nv:hover {
  background:#ffffff0d;
}

.nv.on {
  background:var(--wine);
  color:#fff;
}

.me {
  margin-top:auto;
  display:flex;
  gap:10px;
  align-items:center;
  padding:8px;
  font-size:12px;
}

.av {
  width:30px;
  height:30px;
  border-radius:50%;
  background:var(--wine);
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:600;
  flex:none;
}

main {
  overflow:auto;
  padding:36px 44px;
  color:var(--tx);
}

h1 {
  font:600 30px 'Playfair Display',serif;
  margin-bottom:6px;
}

h2 {
  font:600 19px 'Playfair Display',serif;
  margin-bottom:10px;
}

.mu {
  color:var(--mu);
  font-size:13px;
}

.card {
  background:var(--card);
  color:var(--tx);
  border:1px solid var(--bd);
  border-radius:12px;
  padding:18px;
}

/* Layout Utilities */
.row {
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}

.sp {
  justify-content:space-between;
}

.grid3 {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
}

.ex {
  text-align:left;
  padding:14px;
  border:1px solid var(--bd);
  border-radius:10px;
  background:var(--card);
  color:var(--tx);
  transition:transform .15s,border-color .15s;
}

.ex:hover {
  border-color:var(--wine);
  transform:translateY(-2px);
}

/* Chips */
.chip {
  display:inline-block;
  padding:2px 10px;
  border-radius:99px;
  background:var(--rose);
  color:var(--wine);
  font-size:12px;
  font-weight:500;
}

[data-theme=dark] .chip {
  color:#f0b3c1;
}

.bubble {
  background:var(--rose);
  color:var(--tx);
  padding:12px 16px;
  border-radius:12px;
  margin-left:auto;
  max-width:520px;
}

/* Steps */
.step {
  display:flex;
  gap:12px;
  align-items:flex-start;
  padding:7px 0;
}

.dot {
  width:20px;
  height:20px;
  border-radius:50%;
  border:2px solid var(--bd);
  flex:none;
  display:grid;
  place-items:center;
  color:#fff;
  margin-top:2px;
}

.dot.d {
  background:var(--wine);
  border-color:var(--wine);
}

.dot.a {
  border-color:var(--wine);
  animation:pl 1.2s infinite;
}

@keyframes pl {
  50% {box-shadow:0 0 0 6px #7a123030}
}

/* Tabs */
.tabs {
  display:flex;
  gap:22px;
  border-bottom:1px solid var(--bd);
  margin:16px 0;
}

.tabs button {
  padding:8px 0;
  color:var(--mu);
  border-bottom:2px solid transparent;
}

.tabs .on {
  color:var(--wine);
  border-color:var(--wine);
  font-weight:600;
}

[data-theme=dark] .tabs .on {
  color:#f0b3c1;
  border-color:#f0b3c1;
}

/* Progress */
.bar {
  height:10px;
  border-radius:6px;
  background:var(--bd);
  overflow:hidden;
}

.bar i {
  display:block;
  height:100%;
  background:linear-gradient(90deg,#f2b872,#c2185b,#7d0f37,#f2b872);
  background-size:250% 100%;
  border-radius:6px;
  animation:gw 1.1s backwards,sh 4s linear infinite;
  transition:width .8s;
}

/* Lists */
.two {
  display:grid;
  grid-template-columns:1fr 280px;
  gap:18px;
}

.li {
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 18px;
  background:var(--card);
  color:var(--tx);
  border:1px solid var(--bd);
  border-radius:12px;
  margin-bottom:10px;
  transition:border-color .15s;
}

.li:hover {
  border-color:var(--wine);
}

.li>div:first-child {
  flex:1;
  min-width:0;
}

.li .t {
  font-weight:600;
}

/* Tables */
table {
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

td,th {
  text-align:left;
  padding:9px 8px;
  border-bottom:1px solid var(--bd);
}

th {
  font-weight:600;
  color:var(--mu);
  font-size:13px;
}

/* Upload */
.drop {
  border:1.5px dashed var(--bd);
  border-radius:10px;
  padding:10px 14px;
  background:var(--card);
  color:var(--mu);
  cursor:pointer;
  font-size:13px;
}

/* Toggle */
.sw {
  width:40px;
  height:22px;
  border-radius:99px;
  background:var(--bd);
  position:relative;
  transition:.2s;
}

.sw i {
  position:absolute;
  top:3px;
  left:3px;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}

.sw.on {
  background:var(--wine);
}

.sw.on i {
  left:21px;
}

/* Other Components */
.fld {
  display:flex;
  gap:12px;
  align-items:flex-start;
  margin-bottom:14px;
}

.fld>div:last-child {
  flex:1;
  min-width:0;
}

.fld b {
  display:block;
  margin-bottom:6px;
  font-weight:600;
}

.ic {
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--rose);
  color:var(--wine);
  display:grid;
  place-items:center;
  flex:none;
}

.tile {
  border:1px solid var(--bd);
  border-radius:10px;
  padding:16px 10px;
  text-align:center;
  background:var(--bg);
  color:var(--wine);
  font-weight:600;
  cursor:pointer;
  display:grid;
  gap:4px;
  justify-items:center;
  transition:border-color .15s;
}

.tile:hover,.tile.on {
  border-color:var(--wine);
}

.tile small {
  color:var(--mu);
  font-weight:400;
  font-size:12px;
}

.err {
  color:#c0334f;
  font-size:13px;
  margin-top:6px;
}

/* Welcome */
.wl {
  position:relative;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:44px;
  max-width:1040px;
  padding:32px;
  align-items:center;
  text-align:left;
}

.wl .st {
  display:flex;
  gap:12px;
  align-items:center;
  padding:12px 16px;
  border:1px solid #7a123070;
  border-radius:12px;
  background:#ffffff0a;
  margin-bottom:14px;
  width:min(340px,100%);
}

.wl .st:nth-child(even) {
  margin-left:36px;
}

.mark {
  width:84px;
  height:84px;
  border-radius:22px;
  background:linear-gradient(145deg,#c2185b,#3a0817);
  display:grid;
  place-items:center;
  box-shadow:0 0 50px #c0415f55;
  position:relative;
}

/* Animations */
@keyframes fu {
  from {opacity:0;transform:translateY(16px)}
  to {opacity:1;transform:none}
}

@keyframes fl {
  50% {transform:translateY(-16px)}
}

@keyframes sh {
  to {background-position:-250% 0}
}

@keyframes gl {
  50% {opacity:.45;transform:scale(1.25)}
}

@keyframes ob {
  to {transform:rotate(360deg)}
}

@keyframes br {
  50% {transform:scaleY(.4)}
}

@keyframes gw {
  from {width:0}
}

@keyframes wd {
  from {opacity:0;transform:translateY(22px);filter:blur(8px)}
  to {opacity:1;transform:none;filter:none}
}

.pg {
  animation:fu .45s cubic-bezier(.2,.7,.2,1);
}

.card,.li,.ex,.tile {
  animation:fu .55s backwards;
}

.li:nth-child(2) {animation-delay:.08s}
.li:nth-child(3) {animation-delay:.16s}
.li:nth-child(4) {animation-delay:.24s}

.login>* {
  animation:fu .7s backwards;
}

.card,.li {
  transition:transform .25s,box-shadow .25s,border-color .25s;
}

.card:hover,.li:hover {
  transform:translateY(-3px);
  box-shadow:0 16px 32px #b01a4e22;
  border-color:#c2185b66;
}

.nv:hover {
  transform:translateX(4px);
}

.nv.on {
  background:linear-gradient(135deg,#c2185b,#7d0f37);
  box-shadow:0 6px 18px #b01a4e66;
}

.mark {
  background:linear-gradient(145deg,#c2185b,#3a0817);
}

.cg {
  display:grid;
  grid-template-columns:minmax(0,1fr) 370px;
  gap:20px;
  max-width:1180px;
  min-height:calc(100vh - 72px);
  margin:0 auto;
}

.cg.solo {
  grid-template-columns:minmax(0,720px);
  justify-content:center;
  align-content:center;
}

.col {
  display:flex;
  flex-direction:column;
  gap:16px;
  min-width:0;
}

.sidep {
  animation:si .55s cubic-bezier(.2,.7,.2,1);
}

@keyframes si {
  from {opacity:0;transform:translateX(48px)}
  to {opacity:1;transform:none}
}

.dsb {
  display:flex;
  gap:8px;
  align-items:center;
  border:1px solid var(--bd);
  border-radius:10px;
  background:var(--card);
  padding:4px 4px 4px 0;
}

.adb {
  padding:7px 14px;
  white-space:nowrap;
  font-size:13px;
}

.msgbar {
  border:1px solid var(--bd);
  border-radius:12px;
  background:var(--card);
  padding:6px 12px;
  align-items:center;
}

.xb {
  width:30px;
  height:30px;
  border-radius:50%;
  font-size:22px;
  line-height:1;
  color:var(--mu);
  flex:none;
}

.xb:hover {
  background:var(--rose);
  color:var(--wine);
}

/* Responsive */
@media(max-width:1100px) {
  .cg,.cg.solo {
    grid-template-columns:minmax(0,1fr);
  }
}

@media(max-width:800px) {
  .login {
    grid-template-columns:1fr;
  }

  .lbrand {
    display:none;
  }

  .shell {
    grid-template-columns:1fr;
    grid-template-rows:auto 1fr;
  }

  .side {
    flex-direction:row;
    overflow-x:auto;
    padding:8px;
  }

  .side .logo,.me {
    display:none;
  }

  .nv {
    width:auto;
    white-space:nowrap;
  }

  main {
    padding:22px 16px;
  }

  .two {
    grid-template-columns:1fr;
  }
}

/* Reduced Motion */
@media(prefers-reduced-motion:reduce) {
  * {
    animation:none!important;
    transition:none!important;
  }
}

</style>
</head>

<body>
<div id="root"></div>

<!-- React Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<!-- Application Scripts -->
<script src="js/01-core.js"></script>
<script src="js/02-data.js"></script>
<script src="js/03-Sidebar.js"></script>
<script src="js/04-Profile.js"></script>
<script src="js/04-api.js"></script>
<script src="js/05-Research.js"></script>
<script src="js/06-Paper.js"></script>
<script src="js/07-Chat.js"></script>
<script src="js/08-Scene.js"></script>
<script src="js/09-Welcome2.js"></script>
<script src="js/10-Sessions.js"></script>
<script src="js/11-Saved.js"></script>
<script src="js/12-Settings.js"></script>
<script src="js/13-Login.js"></script>
<script src="js/14-App.js"></script>

</body>
</html>
